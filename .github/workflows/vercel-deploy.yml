name: Vercel Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Avoid stacked concurrent deploys; latest run wins
concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    name: Build & deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Sync the Resend API key from GitHub secrets into Vercel's runtime
      # environment (idempotent). The value is piped via stdin — it never
      # appears in argv, command output, or logs; stdout is discarded.
      - name: Sync RESEND_API_KEY to Vercel
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::error::RESEND_API_KEY is not set in GitHub repo secrets"
            exit 1
          fi
          printf '%s' "$RESEND_API_KEY" | npx vercel env add RESEND_API_KEY production --force --token="$VERCEL_TOKEN" > /dev/null
          printf '%s' "$RESEND_API_KEY" | npx vercel env add RESEND_API_KEY preview --force --token="$VERCEL_TOKEN" > /dev/null

      - name: Pull Vercel environment
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: npx vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy build to Vercel
        id: deploy
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            url="$(npx vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
          else
            url="$(npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Job summary
        run: |
          {
            echo "### 🚀 Vercel deployment"
            echo ""
            echo "- **Environment:** ${{ github.event_name == 'pull_request' && 'Preview' || 'Production' }}"
            echo "- **URL:** ${{ steps.deploy.outputs.url }}"
            echo "- **Commit:** ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
